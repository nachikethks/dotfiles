# Key mappings

# Tab management
map ctrl+shift+h     previous_tab
map ctrl+shift+l     next_tab
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_window
map ctrl+shift+.     move_tab_forward
map ctrl+shift+,     move_tab_backward
map f2 set_tab_title

# Window navigation
map ctrl+shift+alt+h neighboring_window left
map ctrl+shift+alt+l neighboring_window right
map ctrl+shift+alt+k neighboring_window up
map ctrl+shift+alt+j neighboring_window bottom

# Font size management
map ctrl+shift+equal     change_font_size all +1.0
map ctrl+shift+plus      change_font_size all +1.0
map ctrl+shift+kp_add    change_font_size all +1.0
map ctrl+shift+minus     change_font_size all -1.0
map ctrl+shift+kp_subtract change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Scrolling
map ctrl+shift+up        scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+k         scroll_line_up
map ctrl+shift+j         scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home      scroll_home
map ctrl+shift+end       scroll_end

# Selection and clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection

# Miscellaneous
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config
map ctrl+shift+delete clear_terminal reset active
map ctrl+shift+f10 toggle_fullscreen
map ctrl+shift+f11 toggle_maximized
map ctrl+shift+u   kitten unicode_input
map ctrl+shift+f2  edit_config_file
map ctrl+shift+escape kitty_shell window
