force_keyboard_focus = true
close_when_open = true
click_to_close = true
single_click_activation = true
selection_wrap = true
theme = "catppuccin-mocha"
page_jump_items = 8
hide_action_hints = true
hide_action_hints_dmenu = true
resume_last_query = false

[shell]
exclusive_zone = -1
layer = "overlay"
anchor_top = true
anchor_bottom = true
anchor_left = true
anchor_right = true

[placeholders]
"default" = { input = "Search apps, commands, files", list = "No matches" }
"desktopapplications" = { input = "Launch an application", list = "No applications" }
"runner" = { input = "Run a command", list = "No commands" }
"clipboard" = { input = "Clipboard history", list = "Clipboard is empty" }
"symbols" = { input = "Search emoji and symbols", list = "No symbols" }
"unicode" = { input = "Search Unicode characters", list = "No characters" }
"archlinuxpkgs" = { input = "Search Arch and AUR packages", list = "No packages" }
"todo" = { input = "Todo list", list = "No todo items" }
"bluetooth" = { input = "Bluetooth devices", list = "No bluetooth devices" }

[keybinds]
close = ["Escape"]
next = ["Down", "ctrl j"]
previous = ["Up", "ctrl k"]
down = ["Down", "ctrl j"]
up = ["Up", "ctrl k"]
page_down = ["Page_Down", "ctrl d"]
page_up = ["Page_Up", "ctrl u"]
show_actions = ["alt Return"]
toggle_exact = ["ctrl e"]
quick_activate = ["F1", "F2", "F3", "F4"]

[providers]
default = ["desktopapplications", "runner", "calc", "websearch"]
empty = ["desktopapplications"]
max_results = 60

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = "."
provider = "symbols"

[[providers.prefixes]]
prefix = ","
provider = "unicode"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "#"
provider = "archlinuxpkgs"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "!"
provider = "todo"

[[providers.prefixes]]
prefix = "~"
provider = "bluetooth"
